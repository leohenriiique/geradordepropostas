};

/* ---------- rich-text PDF paragraph engine (bold labels, centered titles, wrapping) ---------- */
function measureWordWidth(pdf, word, bold, fontSize){
  pdf.setFont('times', bold?'bold':'normal');
  pdf.setFontSize(fontSize);
  return pdf.getTextWidth(word);
}
function wrapTokensToLines(pdf, tokens, maxWidth, fontSize, firstLineIndent){
  // Fixed estimate for word-wrap decisions only (NOT used for actual rendering/spacing,
  // which is handled natively by the PDF text renderer — see drawLines).
  const spaceWidth = fontSize * 0.28;
  let lines=[], cur=[], curWidth=0, first=true;
  tokens.forEach(({t,bold})=>{
    const ww = measureWordWidth(pdf,t,bold,fontSize);
    const avail = maxWidth - (first?(firstLineIndent||0):0);
    if(curWidth + (cur.length?spaceWidth:0) + ww > avail && cur.length){
      lines.push(cur); first=false; cur=[]; curWidth=0;
    }
    cur.push({t,bold});
    curWidth += (cur.length>1?spaceWidth:0) + ww;
  });
  if(cur.length) lines.push(cur);
  return lines;
}
function ensureSpace(w, needed){
  if(w.y + needed > w.pageHeight - w.marginBottom){ w.pdf.addPage(); w.y = w.marginTop; }
}
/* Groups consecutive same-style tokens into runs and draws each run as ONE string
   (with real space characters embedded). This lets the PDF's own font metrics render
   spacing correctly, instead of relying on manual per-word x-positioning (which was
   producing words with no visible gap between them). */
function drawLines(w, lines, x0, fontSize, align, maxWidth, firstLineIndent){
  const lineHeight = fontSize*1.34;
  lines.forEach((line,li)=>{
    ensureSpace(w, lineHeight);
    let runs=[];
    line.forEach(tok=>{
      if(runs.length && runs[runs.length-1].bold===tok.bold) runs[runs.length-1].words.push(tok.t);
      else runs.push({bold:tok.bold, words:[tok.t]});
    });
    function runString(run, idx){ return run.words.join(' ') + (idx<runs.length-1?' ':''); }
    function runWidth(run, idx){
      w.pdf.setFont('times', run.bold?'bold':'normal'); w.pdf.setFontSize(fontSize);
      return w.pdf.getTextWidth(runString(run, idx));
    }
    let total=0;
    runs.forEach((run,idx)=>{ total += runWidth(run, idx); });

    let x = x0 + (li===0?(firstLineIndent||0):0);
    if(align==='center') x = x0 + (maxWidth-total)/2;

    runs.forEach((run,idx)=>{
      w.pdf.setFont('times', run.bold?'bold':'normal'); w.pdf.setFontSize(fontSize);
      const s = runString(run, idx);
      w.pdf.text(s, x, w.y);
      x += w.pdf.getTextWidth(s) + 0.6; // small safety margin between style transitions
    });
    w.y += lineHeight;
  });
}
function writeParagraph(w, opts){
  const fontSize = opts.fontSize||10.2;
  const maxWidth = w.pageWidth-w.marginLeft-w.marginRight;
  const indent = opts.indent||0;
  let tokens=[];
  if(opts.label) opts.label.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:true}));
  if(opts.text) opts.text.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:!!opts.bold}));
  if(!tokens.length){ w.y += opts.spacingAfter!=null?opts.spacingAfter:6; return; }
  const lines = wrapTokensToLines(w.pdf, tokens, maxWidth, fontSize, indent);
  drawLines(w, lines, w.marginLeft, fontSize, opts.align, maxWidth, indent);
  w.y += opts.spacingAfter!=null?opts.spacingAfter:6;
}
function drawResumoTable(w, rows){
  const tableX = w.marginLeft;
  const tableWidth = w.pageWidth - w.marginLeft - w.marginRight;
  const colLeftWidth = tableWidth*0.28, colRightWidth = tableWidth-colLeftWidth;
  const pad = 7, fontSize = 9.4, lineHeight = fontSize*1.34;

  ensureSpace(w, 22);
  w.pdf.setDrawColor(0,0,0); w.pdf.setLineWidth(0.7);
  w.pdf.rect(tableX, w.y, tableWidth, 20);
  w.pdf.setFont('times','bold'); w.pdf.setFontSize(10.2);
  w.pdf.text('QUADRO RESUMO DA CONTRATAÇÃO', tableX+tableWidth/2, w.y+14, {align:'center'});
  w.y += 20;

  rows.forEach(row=>{
    const labelTokens = row.label.trim().split(/\s+/).map(t=>({t,bold:true}));
    const labelLines = wrapTokensToLines(w.pdf, labelTokens, colLeftWidth-2*pad, fontSize);
    let rightLines=[];
    row.items.forEach((item,idx)=>{
      let tokens=[];
      if(item.label) item.label.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:true}));
      item.text.trim().split(/\s+/).forEach(t=>tokens.push({t,bold:!!item.bold}));
      rightLines = rightLines.concat(wrapTokensToLines(w.pdf, tokens, colRightWidth-2*pad, fontSize, item.indent||0));
      if(idx<row.items.length-1) rightLines.push([]);
    });
    const leftH = labelLines.length*lineHeight + 2*pad;
    const rightH = rightLines.length*lineHeight + 2*pad;
    const rowH = Math.max(leftH, rightH, 30);

    ensureSpace(w, rowH);
    const rowTop = w.y;
    w.pdf.rect(tableX, rowTop, colLeftWidth, rowH);
    w.pdf.rect(tableX+colLeftWidth, rowTop, colRightWidth, rowH);

    w.y = rowTop + pad;
    drawLines(w, labelLines, tableX+pad, fontSize, 'left', colLeftWidth-2*pad, 0);

    w.y = rowTop + pad;
    rightLines.forEach(line=>{
      if(!line.length){ w.y += lineHeight*0.5; return; }
      drawLines(w, [line], tableX+colLeftWidth+pad, fontSize, 'left', colRightWidth-2*pad, 0);
    });
    w.y = rowTop + rowH;
  });
  w.y += 16;
}

    writeParagraph(w, {label:'III –', text:'Dos prazos preestabelecidos por fornecedores dos materiais empregados na instalação e pela Concessionária de Energia.', indent:28});
    writeParagraph(w, {label:'Parágrafo Primeiro –', text:`Nos termos do caput, o prazo total estimado para a conclusão e operacionalização do Sistema Solar Fotovoltaico a ser instalado, é de ${d.prazoConclusaoDias} (${qtdExtenso(d.prazoConclusaoDias)}) dias contínuos.`, indent:28});
    writeParagraph(w, {label:'Parágrafo Segundo –', text:'Para todos os efeitos legais e convencionais, a CONTRATADA vincula-se e obriga-se a cumprir o cronograma de execução dos serviços sob o prazo total estimado, sem que os eventuais adiantamentos ou atrasos singulares das fases e subfases possam configurar inadimplemento de suas obrigações.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA QUINTA –', text:'Sem prejuízo do disposto neste CAPÍTULO III, a execução das fases e subfases, nos termos da CLÁUSULA TERCEIRA, poderá – mediante prévia comunicação ao(à) CONTRATANTE – ter o ônus de sua consecução transferido a terceiros, que atuarão sob o mando, a responsabilidade, os riscos e os encargos da CONTRATADA, sujeitando-se, no que couber, às disposições deste Pacto.', indent:28, spacingAfter:14});

    // ---- CAPÍTULO IV ----
    writeParagraph(w, {text:'CAPÍTULO IV – DAS OBRIGAÇÕES DA CONTRATADA', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA SEXTA –', text:'Para a consecução dos fins deste Instrumento Particular, a CONTRATADA obriga-se:', indent:28});
    [
      ['I –','A cumprir, fiel e zelosamente, todas as Cláusulas e Condições previstas neste Pacto;'],
      ['II –','A atentar-se a todos os riscos inerentes ao exercício da prestação de serviços, obrigando-se a zelar pela saúde e integridade física de seus colaboradores, bem como a manter estrita observância das leis, decretos, portarias, resoluções, instruções normativas, regulamentos, recomendações técnicas e demais normas que tenham regência sobre o objeto deste Pacto;'],
      ['III –','A solicitar ao(à) CONTRATANTE, em modos e prazos apropriados, todos os materiais, produtos e artigos eventualmente necessários, nos termos deste Instrumento Particular, ao exercício da prestação de serviços objeto deste Pacto;'],
      ['IV –','A transmitir ao(à) CONTRATANTE, por escrito ou por alguma forma a isso reduzível, as eventuais recomendações e instruções acerca da operação do Sistema Solar Fotovoltaico instalado;'],
      ['V –','A empregar, na execução dos serviços, mão de obra tecnicamente habilitada e capacitada com os requisitos indispensáveis para o exercício das respectivas atribuições, sendo a CONTRATADA, para todos os efeitos legais e convencionais, a única e exclusiva responsável pelas atividades desempenhadas e pelo fornecimento de Equipamentos de Proteção Individual e Coletiva (EPI e EPC) e a regularidade jurídica dos vínculos empregatícios;'],
      ['VI –','A empregar, na execução dos serviços, mão de obra juridicamente regular, respondendo a CONTRATADA por todo e qualquer encargo de natureza trabalhista e previdenciária;'],
      ['VII –','A observar, nas fases e subfases de execução dos serviços, as práticas e prescrições técnicas adotadas e consolidadas nacionalmente quanto a Sistemas Solares Fotovoltaicos;'],
      ['VIII –','A considerar, nas fases e subfases de execução dos serviços, as documentações e informações fornecidas pelo(a) CONTRATANTE, sem prejuízo de constatações e registros espontaneamente obtidos por equipe técnica;'],
      ['IX –','A arcar com os eventuais danos causados ao(à) CONTRATANTE por eventual culpa ou dolo na conduta de seus colaboradores envolvidos na execução dos serviços pactuados, desde que estejam previamente autorizados pela CONTRATADA e em exercício regular, em tempo e modo, de suas funções técnicas;'],
      ['X –','A solicitar, junto à Concessionária de Energia, a conexão do Sistema Solar Fotovoltaico instalado à rede pública;'],
      ['XI –','A cumprir, em modos e prazos apropriados, as fases e subfases de execução, nos termos do CAPÍTULO III, do Projeto Elétrico especialmente concebido, por força deste Instrumento Particular, para atender o(a) CONTRATANTE e unidade imobiliária indicada;'],
      ['XII –','A zelar pelo sigilo, integridade e confidencialidade de todos os documentos, projetos, declarações, comprovantes, informações e dados providenciados e entregues pelo(a) CONTRATANTE;'],
      ['XIII –','A comunicar ao(à) CONTRATANTE, tempestivamente e por meio idôneo, toda e qualquer ocorrência que modifique, interfira, retarde, obstrua ou impeça a execução das fases e subfases, nos termos do CAPÍTULO III;'],
      ['XIV –','A arcar, integralmente e nos termos da legislação aplicável, com a remuneração de seus colaboradores, bem como com quaisquer outras verbas que lhes sejam devidas, assumindo total responsabilidade pelos encargos, tributos e contribuições incidentes sobre a referida subordinação;'],
      ['XV –','A guardar, por si e por seus colaboradores, conduta condizente com a dignidade do mister, procedendo com afabilidade, civilidade e cortesia para com o(a) CONTRATANTE e terceiros;'],
      ['XVI –','A fornecer ao(à) CONTRATANTE a garantia legal e convencional sobre os serviços prestados, sob o prazo decadencial de 1 (um) ano, contados da data de conclusão e operacionalização do Sistema Solar Fotovoltaico a ser instalado.'],
    ].forEach(([num,txt])=>writeParagraph(w,{label:num, text:txt, indent:28, spacingAfter:6}));
    writeParagraph(w, {label:'CLÁUSULA SÉTIMA –', text:'Sem prejuízo do disposto neste CAPÍTULO IV, a CONTRATADA se obriga, em dias úteis e horário comercial, a prestar informações e relatórios, naquilo que lhe for possível acessar e mediante prévia solicitação do(a) CONTRATANTE, acerca das fases e subfases executadas.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA OITAVA –', text:'Para todos os efeitos legais e convencionais, ficam excluídos deste CAPÍTULO IV e do escopo deste Instrumento Particular, nos termos do CAPÍTULO II, a execução, por parte da CONTRATADA, de quaisquer serviços de alvenaria, fundação, armação e sustentação, e demais obras civis, na unidade imobiliária indicada pelo(a) CONTRATANTE.', indent:28});
    writeParagraph(w, {label:'Parágrafo Único –', text:'Sem prejuízo do disposto no caput, as necessidades estruturais de instalação do Sistema Solar Fotovoltaico na unidade imobiliária serão formalmente comunicadas ao(à) CONTRATANTE nas fases de Avaliação Preliminar e Desenvolvimento do Projeto, nos termos do CAPÍTULO III.', indent:28, spacingAfter:14});

    // ---- CAPÍTULO V ----
    writeParagraph(w, {text:'CAPÍTULO V – DAS OBRIGAÇÕES DA CONTRATANTE', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA NONA –', text:'Para a consecução dos fins deste Instrumento Particular, o(a) CONTRATANTE obriga-se:', indent:28});
    [
      ['I –','A cumprir, fiel e zelosamente, todas as Cláusulas e Condições previstas neste Pacto;'],
      ['II –','A pagar à CONTRATADA o preço acordado, consoante o prazo, a forma e as condições estabelecidas no CAPÍTULO VI;'],
      ['III –','A providenciar e entregar, em condições e prazos apropriados, todos os documentos, projetos, declarações, comprovantes, informações e dados necessários à competente prestação dos serviços discriminados neste Instrumento, nos termos do CAPÍTULOS II e III, segundo a demanda da CONTRATADA, competindo a este solicitá-los em tempo hábil e zelar por seus sigilo, integridade e confidencialidade;'],
      ['IV –','A permitir e facilitar, mediante prévio agendamento, o acesso dos colaboradores da CONTRATADA na unidade imobiliária;'],
      ['V –','A conduzir, às suas expensas, os eventuais processos de adequação da unidade imobiliária – unificação ou alteração de titularidade, adequação de caixas, padrões, cabos e/ou disjuntores de entrada, adequação de rede ou transformador de entrada, adequação de estruturas, processos de aumento de carga; serviços de alvenaria, fundação, armação e sustentação; e demais obras civis –.'],
      ['VI –','A realizar a manutenção preventiva, conforme as instruções da CONTRATADA, do Central Geradora e das respectivas estruturas de sustentação, durante toda a vida útil do Sistema Solar Fotovoltaico.'],
      ['VII –','A observar as eventuais recomendações e instruções emanadas pela CONTRATADA;'],
      ['VIII –','A comunicar à CONTRATADA, tempestivamente e por meio idôneo, toda e qualquer ocorrência que modifique, interfira, retarde, obstrua ou impeça a execução das fases e subfases da execução, nos termos do CAPÍTULO III;'],
      ['IX –','A outorgar, na data de conclusão e operacionalização do Sistema Solar Fotovoltaico a ser instalado, Termo de Conclusão de Obra em favor da CONTRATADA.'],
    ].forEach(([num,txt])=>writeParagraph(w,{label:num, text:txt, indent:28, spacingAfter:6}));
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA –', text:'O(A) CONTRATANTE deverá providenciar e entregar, em condições e prazos apropriados, todos os documentos, projetos, declarações, comprovantes, informações e dados necessários à competente prestação dos serviços discriminados neste Instrumento, segundo a demanda da CONTRATADA, competindo a esta solicitá-los em tempo hábil e zelar por seus sigilo, integridade e confidencialidade, dando justo e fiel cumprimento ao Pacto.', indent:28});
    writeParagraph(w, {label:'Parágrafo Primeiro –', text:'A recusa, desídia, negligência ou morosidade do(a) CONTRATANTE em apresentar as documentações requeridas pela CONTRATADA, vincularão aquele a todos os prejuízos da execução deficiente dos serviços, ou mesmo da inexecução, eximindo-se esta última dos ônus inerentes à prestação não ocorrida.', indent:28});
    writeParagraph(w, {label:'Parágrafo Segundo –', text:'São de inteira responsabilidade do(a) CONTRATANTE os documentos, projetos, declarações, comprovantes, informações e dados prestados à CONTRATADA durante a execução dos serviços, sobretudo aqueles eventualmente inidôneos ou incompletos.', indent:28});
    writeParagraph(w, {label:'Parágrafo Terceiro –', text:'A CONTRATADA não assume nenhuma responsabilidade sobre as omissões próprias do(a) CONTRATANTE, tanto menos sobre as consequências direta ou indiretamente decorrentes do desrespeito às orientações, instruções e treinamentos prestados.', indent:28, spacingAfter:14});

    // ---- CAPÍTULO VI ----
    writeParagraph(w, {text:'CAPÍTULO VI – DO PREÇO E DA FORMA DE PAGAMENTO', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA PRIMEIRA –', text:`Nos termos da Proposta Comercial, o(a) CONTRATANTE pagará à CONTRATADA, pelo exercício da prestação de serviços e fornecimento de materiais, o valor líquido, certo e exigível de R$ ${fmtMoney(d.valorTotal)} (${valorExtenso(d.valorTotal)}), conforme as seguintes condições de pagamento:`, indent:28});
    writeParagraph(w, {label:'I –', text:`Forma de Pagamento: ${d.formaPagamentoTexto}`, indent:28});
    writeParagraph(w, {label:'Parágrafo Único –', text:'O inadimplemento de quaisquer valores devidos, nas datas e condições avençadas, acarretará a incidência da multa moratória de 2% (dois por cento), dos juros moratórios de 1% (um por cento) ao mês, pro rata die, e da correção monetária pelo IPCA/IBGE (Índice Nacional de Preços ao Consumidor Amplo, do Instituto Brasileiro de Geografia e Estatística).', indent:28, spacingAfter:14});

    // ---- CAPÍTULO VII ----
    writeParagraph(w, {text:'CAPÍTULO VII – DAS DECLARAÇÕES', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA SEGUNDA –', text:'Sem prejuízo do disposto nas demais Cláusulas e Condições, as Partes declaram-se cientes de que:', indent:28});
    [
      ['I –','Arcarão com o pagamento dos tributos, encargos e contribuições que lhes forem legalmente imputados, conforme a ocorrência de fato gerador tributário pelas suas respectivas participações na relação contratual;'],
      ['II –','Nenhuma das Partes se responsabilizará por intercorrências definidas como "caso fortuito" ou "força maior", contemplados pelo art. 393 da Lei 10.406/2002 (Código Civil Brasileiro), devendo, para tanto, informar imediatamente a outra dos fatos e dos efeitos danosos;'],
      ['III –','O presente Instrumento Particular não importa na criação de qualquer acordo operacional; "joint venture"; associação; vínculo societário, ou consórcio entre as Partes; sendo expressamente excluídas quaisquer presunções de dependência, solidariedade ou subsidiariedade, ativa ou passiva, entre elas, no cumprimento de suas obrigações contratadas;'],
      ['IV –','O presente Instrumento Particular também não estabelece qualquer vínculo empregatício ou de responsabilidade por parte do(a) CONTRATANTE, seja solidária ou subsidiariamente, quanto à CONTRATADA e aos terceiros a quem transferir os ônus da consecução do objeto contratual, correndo por sua conta exclusiva todas as despesas incorridas, sem prejuízo dos encargos legais e dos custos da eventual participação em Juízo;'],
      ['V –','O presente Instrumento Particular contempla a unicidade e a totalidade do acordo havido entre Partes quanto ao objeto contratual, encerrando a vigência, o vigor e a vinculação convencional de qualquer outra negociação, oferta, promessa, obrigação ou estipulação – sob forma escrita ou verbal – realizadas ou contraídas antes de ser iniciada a vigência deste Pacto;'],
      ['VI –','A responsabilidade exclusiva, de uma das Partes, pela inexecução do presente Instrumento Particular não exime a Parte Culpada de responder judicialmente pelas perdas e danos eventualmente suportados pela Parte Inocente frente sua conduta;'],
      ['VII –','As garantias, legal e convencional, serão regidas, quanto a seus termos e condições, pelo presente Instrumento Particular e pelos Termos de Conclusão de Obra e de Garantia Convencional.'],
    ].forEach(([num,txt])=>writeParagraph(w,{label:num, text:txt, indent:28, spacingAfter:6}));

    // ---- CAPÍTULO VIII ----
    writeParagraph(w, {text:'CAPÍTULO VIII – DA VIGÊNCIA E EXTINÇÃO DO VÍNCULO CONTRATUAL', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA TERCEIRA –', text:'O presente Instrumento Particular entra em vigor a partir da data de sua assinatura e vigerá por prazo de garantia oferecido dos equipamentos, obrigando as Partes e seus sucessores, a qualquer título.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA QUARTA –', text:'A resilição deste Instrumento Particular, sendo unilateral, deverá ser antecedida pela respectiva Denúncia, mediante notificação escrita diretamente remetida pelo Denunciante ao Denunciado; sendo bilateral, deverá aperfeiçoar-se com o respectivo Distrato, que possuirá forma escrita e poderá ser pactuado a qualquer tempo.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA QUINTA –', text:'Constituirá motivo de resolução deste Instrumento Particular, por qualquer das Partes, o inadimplemento, culposo ou não, de quaisquer de suas Cláusulas e Condições.', indent:28});
    writeParagraph(w, {label:'Parágrafo Primeiro –', text:'Nos termos do caput, serão consideradas causas de resolução, para todos os fins legais e contratuais, a insolvência civil, a recuperação judicial, a falência ou a liquidação de qualquer das Partes, hipóteses nas quais a data da resolução retroagirá àquela em que for formulado o pedido de insolvência, de recuperação judicial, de falência ou de liquidação, conforme o caso e sem prejuízo dos valores devidos.', indent:28});
    writeParagraph(w, {label:'Parágrafo Segundo –', text:'Fica estipulada a multa compensatória de 10% (dez por cento) sobre o valor total deste Instrumento Particular – sem prejuízo de eventual indenização suplementar, caso os danos suportados comprovadamente excedam o previsto neste parágrafo –, para a Parte que ensejar a resolução do Pacto, nos termos do caput, sendo facultado à Parte Inocente considerá-lo simultaneamente resolvido, independentemente do tempo decorrido e de anterior aviso, interpelação ou notificação.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA SEXTA –', text:'A extinção do vínculo contratual não extinguirá, salvo expressa e escrita estipulação em contrário, os direitos e obrigações que, distintos do objeto contratado, decorrerem da celebração deste Instrumento Particular e forem adquiridos durante sua vigência, entre as Partes e para com terceiros.', indent:28, spacingAfter:14});

    // ---- CAPÍTULO IX ----
    writeParagraph(w, {text:'CAPÍTULO IX – DAS POLÍTICAS E PRÁTICAS DE CONFORMIDADE', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA SÉTIMA –', text:'Para o fiel cumprimento do presente Instrumento Particular, as Partes não poderão oferecer, dar ou se comprometer a dar a quem quer que seja; ou aceitar ou se comprometer a aceitar de quem quer que seja, tanto por conta própria quanto por meio de outrem; qualquer pagamento, doação, compensação, vantagens financeiras ou não financeiras, ou benefícios de qualquer espécie, que constituam prática ilegal ou de corrupção, seja de forma direta ou indireta, quanto ao objeto deste Pacto.', indent:28, spacingAfter:14});

    // ---- CAPÍTULO X ----
    writeParagraph(w, {text:'CAPÍTULO X – DAS CONDIÇÕES GERAIS', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA OITAVA –', text:'Repactuações, adições, subtrações e quaisquer outras alterações no teor contratado implicarão, impreterivelmente, a celebração de TERMO ADITIVO, constituindo-se este em documento indissociável do presente Instrumento Particular, devendo ser indistintamente emitido e firmado em tantas vias quantas forem este último, com exatos teor e forma – gozando das mesmas garantia e justeza deste –, tão logo sejam encerradas as modificações.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA DÉCIMA NONA –', text:'Quaisquer tolerâncias ou concessões entre as Partes não constituirão precedentes invocáveis por elas e não importarão em consequente novação ou alteração das Cláusulas e Condições do presente Instrumento Particular, salvo expressa estipulação em contrário – que deverá ser manifesta por escrito ou por alguma forma a isso reduzível –.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA VIGÉSIMA –', text:'Todas as tratativas, negociações, comunicações e notificações entre as Partes deverão observar a forma escrita e dar-se-ão por qualquer meio de comunicação idôneo, no qual se comprove a entrega aos competentes destinatários e seja fixado prazo de resposta, a depender do caso.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA VIGÉSIMA PRIMEIRA –', text:'A inviabilidade e/ou invalidade da execução das Cláusulas e Condições do presente Instrumento Particular, ainda que em virtude de decisão judicial, não afetará a viabilidade e/ou validade das demais, e nem obstará seu cumprimento, permanecendo a incolumidade dos termos.', indent:28});
    writeParagraph(w, {label:'CLÁUSULA VIGÉSIMA SEGUNDA –', text:'Para todos os efeitos legais e convencionais, admitir-se-á a firma deste Instrumento Particular por meio eletrônico – incluindo assinaturas eletrônicas em plataformas digitais –, estando as Partes expressamente cientes e concordes com as suas validade, integridade e vinculação, ainda que não seja utilizado certificado digital emitido pelo ICP-Brasil (Infraestrutura de Chaves Públicas Brasileira), nos termos do artigo 10, § 1º, § 2º, da Medida Provisória nº 2.200-2/2001.', indent:28, spacingAfter:14});

    // ---- CAPÍTULO XI ----
    writeParagraph(w, {text:'CAPÍTULO XI – DO FORO', align:'center', bold:true, fontSize:11, spacingAfter:14});
    writeParagraph(w, {label:'CLÁUSULA VIGÉSIMA TERCEIRA –', text:`As Partes anuem que todos os conflitos, dúvidas, omissões, questionamentos ou cobranças de qualquer natureza, oriundos deste Instrumento Particular, serão, quando não sanados consensualmente, dirimidos no Foro da Comarca de ${foro}, eleito com expressa renúncia de qualquer outro, por mais privilegiado que seja.`, indent:28, spacingAfter:16});

    writeParagraph(w, {text:'E, por estarem justos e contratados – e de pleno acordo quanto às Cláusulas e Condições acima estipuladas –, assinam este Instrumento Particular de Prestação de Serviços e Fornecimento de Materiais em 02 (duas) vias de igual teor e forma, para os mesmos efeitos legais.', indent:28, spacingAfter:26});

    writeParagraph(w, {text:`${(ct.cidade||d.clienteCidade)} ${(ct.uf||d.clienteUf)}, ${dataFmt}.`, spacingAfter:60});

    // signature blocks
    ensureSpace(w, 60);
    writeParagraph(w, {text:'_'.repeat(55), align:'center', spacingAfter:4});
    writeParagraph(w, {text:d.clienteNome.toUpperCase(), align:'center', bold:true, spacingAfter:2});
    writeParagraph(w, {text:'CONTRATANTE', align:'center', spacingAfter:40});

    ensureSpace(w, 60);
    writeParagraph(w, {text:'_'.repeat(55), align:'center', spacingAfter:4});
    writeParagraph(w, {text:(ct.representanteNome||'').toUpperCase(), align:'center', bold:true, spacingAfter:2});
    writeParagraph(w, {text:'CONTRATADA', align:'center', spacingAfter:4});

    // final pass: logo + page numbers on every page
    const totalPages = pdf.internal.getNumberOfPages();
    let logoSrc = null;
    try{ logoSrc = document.getElementById('logo-img').src; }catch(e){}
    for(let i=1;i<=totalPages;i++){
      pdf.setPage(i);
      if(logoSrc){
        try{ pdf.addImage(logoSrc, 'PNG', w.marginLeft, 22, 52, 36); }catch(e){}
      }
      pdf.setFont('times','normal'); pdf.setFontSize(8.5);
      pdf.text(`Página ${i} de ${totalPages}`, w.pageWidth/2, w.pageHeight-28, {align:'center'});
    }

    const fname = `Contrato_${(d.clienteNome||'cliente').replace(/[^a-zA-Z0-9]+/g,'_')}.pdf`;
    pdf.save(fname);
    toast('Contrato gerado com sucesso.');
    return true;
  }catch(err){
    console.error('Erro ao gerar contrato:', err);
    toast('Erro ao gerar o contrato: '+(err&&err.message?err.message:err));
    return false;
  }
}

(async function init(){
  if(!SUPABASE_CONFIGURED){
    const banner=document.createElement('div');
    banner.style.cssText='background:#C0392B;color:#fff;padding:10px 22px;font-size:13px;font-weight:600;text-align:center;';
    banner.textContent='⚠ Supabase não configurado: edite SUPABASE_URL e SUPABASE_ANON_KEY no início do arquivo. Os dados não serão salvos entre sessões até isso ser feito.';
    document.body.insertBefore(banner, document.body.firstChild);
  }
  await checkAuthAndStart();
})();
</script>
